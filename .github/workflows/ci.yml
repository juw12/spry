name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Test (unit, real process levers, the whole program)
        run: cargo test --release --no-fail-fast
      - name: Measure on this runner
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p bench
          ./target/release/spry bench --secs 4 --json | tee "bench/${{ matrix.os }}.json"
          ls -l target/release/spry* | head -3
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: bench-${{ matrix.os }}
          path: bench/
