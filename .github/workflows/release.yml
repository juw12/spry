name: release

# A tag publishes a release. Started by hand (Actions > release > Run workflow) it only builds:
# every download is made and kept with the run for a week, and nothing is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: spry-windows-x64.zip
          - os: macos-15
            asset: spry-macos-universal.tar.gz
            app: Spry-macos.zip
          - os: ubuntu-latest
            asset: spry-linux-x64.tar.gz
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            asset: spry-linux-arm64.tar.gz
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust present (some runners come without it)
        if: runner.os == 'Linux'
        run: |
          command -v rustup >/dev/null 2>&1 || curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release
          Compress-Archive -Path target/release/spry.exe -DestinationPath ${{ matrix.asset }}

      - name: Build (macOS, Intel and Apple silicon in one file)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.13"
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          lipo -create -output spry target/x86_64-apple-darwin/release/spry target/aarch64-apple-darwin/release/spry
          codesign --force --sign - spry
          lipo -info spry
          ./spry version
          tar -czf ${{ matrix.asset }} spry
          # The same program as an app: Spry.app, zipped the way Finder opens it.
          sh scripts/bundle-macos.sh spry dist
          dist/Spry.app/Contents/MacOS/spry version
          codesign --verify --deep --strict dist/Spry.app
          ditto -c -k --keepParent dist/Spry.app ${{ matrix.app }}

      - name: Build (Linux, runs on any distribution)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/spry spry
          ./spry version
          tar -czf ${{ matrix.asset }} spry

      - name: Checksum
        shell: bash
        run: |
          for file in "${{ matrix.asset }}" ${{ matrix.app }}; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$file"
            else
              shasum -a 256 "$file"
            fi | tee "$file.sha256"
          done

      # A signed record that this exact file was built by this workflow from this commit.
      # Anyone can check it:  gh attestation verify <file> -R juw12/spry
      - name: Build record
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.asset }}

      - name: Build record (the Mac app)
        if: matrix.app && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.app }}

      # The release is not yet "latest": the download links on the README point at the latest release,
      # and they must not lead to a release that still lacks a file. The last job below sets it.
      - name: Keep the downloads with a run that was started by hand
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          retention-days: 7
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
            ${{ matrix.app }}
            ${{ matrix.app && format('{0}.sha256', matrix.app) }}

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Several systems finish at about the same time; when another one made the release first, that is fine.
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" --title "Spry ${{ github.ref_name }}" --generate-notes --latest=false \
            || gh release view "${{ github.ref_name }}" >/dev/null
          for file in "${{ matrix.asset }}" ${{ matrix.app }}; do
            gh release upload "${{ github.ref_name }}" "$file" "$file.sha256" --clobber
          done

  # Only when every system has its download does the release become the one the links lead to.
  latest:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Every download is there
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          have="$(gh release view "${{ github.ref_name }}" -R "${{ github.repository }}" --json assets --jq '.assets[].name')"
          for file in spry-windows-x64.zip Spry-macos.zip spry-macos-universal.tar.gz spry-linux-x64.tar.gz spry-linux-arm64.tar.gz; do
            for name in "$file" "$file.sha256"; do
              echo "$have" | grep -qx "$name" || { echo "missing from the release: $name" >&2; exit 1; }
            done
          done
      - name: Make it the latest release, then run the install steps against it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ github.ref_name }}" -R "${{ github.repository }}" --latest
          gh workflow run install.yml -R "${{ github.repository }}" --ref main
