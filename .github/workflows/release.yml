name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: spry-windows-x64.zip
          - os: macos-15
            asset: spry-macos-universal.tar.gz
          - os: ubuntu-latest
            asset: spry-linux-x64.tar.gz
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            asset: spry-linux-arm64.tar.gz
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust present (some runners come without it)
        if: runner.os == 'Linux'
        run: |
          command -v rustup >/dev/null 2>&1 || curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release
          Compress-Archive -Path target/release/spry.exe -DestinationPath ${{ matrix.asset }}

      - name: Build (macOS, Intel and Apple silicon in one file)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.13"
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          lipo -create -output spry target/x86_64-apple-darwin/release/spry target/aarch64-apple-darwin/release/spry
          codesign --force --sign - spry
          lipo -info spry
          ./spry version
          tar -czf ${{ matrix.asset }} spry

      - name: Build (Linux, runs on any distribution)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/spry spry
          ./spry version
          tar -czf ${{ matrix.asset }} spry

      - name: Checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}"
          else
            shasum -a 256 "${{ matrix.asset }}"
          fi | tee "${{ matrix.asset }}.sha256"

      # A signed record that this exact file was built by this workflow from this commit.
      # Anyone can check it:  gh attestation verify <file> -R juw12/spry
      - name: Build record
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.asset }}

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --title "Spry ${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" "${{ matrix.asset }}" "${{ matrix.asset }}.sha256" --clobber
