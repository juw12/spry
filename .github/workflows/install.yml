name: install
# Runs the two install scripts the README tells people to use, against the published
# release, on each system - then checks that the installed Spry starts and answers,
# that it updates itself from the release page and starts again, that a changed download
# is refused, and that the download carries a build record.
on:
  push:
    branches: [main]
    paths: [install.sh, install.ps1, .github/workflows/install.yml]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: A changed download is refused and nothing is installed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir changed && cd changed
          gh release download -R juw12/spry --pattern '*.sha256'
          for sum in *.sha256; do echo "not spry" > "${sum%.sha256}"; done
          if SPRY_FROM="file://$PWD" SPRY_INSTALL_DIR="$PWD/out" SPRY_NO_START=1 sh ../install.sh; then
            echo "a changed download was installed" >&2
            exit 1
          fi
          test ! -e out/spry
      - name: Install the way the README says
        run: sh install.sh
      - name: The installed Spry is running and answers
        run: |
          sleep 5
          "$HOME/.local/bin/spry" version
          "$HOME/.local/bin/spry" status
      # SPRY_UPDATE_AS makes this Spry take itself for an older one, so it fetches the release it
      # was installed from, checks it, puts it in its own place and starts again.
      - name: The installed Spry updates itself from the release page and starts again
        run: |
          spry="$HOME/.local/bin/spry"
          if ! "$spry" help | grep -q "spry update"; then
            echo "This release is from before 0.6 and cannot update itself."
            exit 0
          fi
          running() { "$spry" status --json | sed -n 's/.*"spry_pid":\([0-9]*\).*/\1/p'; }
          before="$(running)"
          SPRY_UPDATE_AS=0.0.1 "$spry" update
          sleep 10
          after="$(running)"
          echo "Spry was process $before and is process $after now"
          test -n "$before" && test -n "$after" && test "$after" != "$before"
          "$spry" status | head -n 2
      - name: What Spry itself costs after half a minute
        run: |
          sleep 30
          "$HOME/.local/bin/spry" status | head -n 2
          ps -o rss=,time=,etime= -p "$(pgrep -x spry | head -n 1)"
      - name: Stopping it leaves nothing held
        run: |
          pkill -x spry
          sleep 2
          ! pgrep -x spry
          "$HOME/.local/bin/spry" rescue
      # The other way the README gives on a Mac: Spry-macos.zip from the browser, no Terminal.
      # A test machine cannot press "Open Anyway", so this checks what needs no person: the zip
      # is the file the release page names, opens the way Finder opens it, and the app in it is
      # whole, signed (ad hoc, not by Apple) for both kinds of Mac, and is the released version.
      # The last line prints what macOS says about an app that came through a browser.
      - name: The Mac app from the browser download is whole
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir browser && cd browser
          if ! gh release download -R juw12/spry --pattern 'Spry-macos.zip' --pattern 'Spry-macos.zip.sha256'; then
            echo "This release is from before 0.4 and has no Mac app."
            exit 0
          fi
          test "$(shasum -a 256 Spry-macos.zip | cut -d' ' -f1)" = "$(cut -d' ' -f1 Spry-macos.zip.sha256)"
          ditto -x -k Spry-macos.zip .
          codesign --verify --deep --strict --verbose=2 Spry.app
          lipo -archs Spry.app/Contents/MacOS/spry
          lipo -archs Spry.app/Contents/MacOS/spry | grep -q x86_64
          lipo -archs Spry.app/Contents/MacOS/spry | grep -q arm64
          want="$("$HOME/.local/bin/spry" version)"
          got="$(Spry.app/Contents/MacOS/spry version)"
          echo "the app in the zip says: $got"
          test "$got" = "$want"
          xattr -r -w com.apple.quarantine "0083;$(printf '%x' "$(date +%s)");Safari;" Spry.app
          spctl --assess --type execute --verbose=4 Spry.app || echo "macOS asks before the first start, as the README says"
      - name: Each download was built by this repository's release workflow
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir built && cd built
          gh release download -R juw12/spry --pattern 'spry-*' --pattern 'Spry-*'
          for file in spry-*.zip spry-*.tar.gz Spry-*.zip; do
            [ -e "$file" ] || continue  # a release from before 0.4 has no Mac app
            sha256sum "$file" | cut -d' ' -f1 > got
            cut -d' ' -f1 "$file.sha256" > want
            cmp got want
            gh attestation verify "$file" -R juw12/spry --signer-workflow juw12/spry/.github/workflows/release.yml \
              --format json --jq '.[].verificationResult.signature.certificate | "'"$file"': " + .sourceRepositoryRef + " " + .sourceRepositoryDigest + " built by " + .buildSignerURI'
          done

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: A changed download is refused and nothing is installed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory changed | Out-Null
          gh release download -R juw12/spry --pattern 'spry-windows-x64.zip.sha256' --dir changed
          Set-Content changed/spry-windows-x64.zip "not spry"
          $server = Start-Process python -ArgumentList "-m", "http.server", "8765", "--bind", "127.0.0.1", "--directory", "changed" -PassThru
          Start-Sleep -Seconds 3
          $env:SPRY_FROM = "http://127.0.0.1:8765"
          $refused = $false
          try { ./install.ps1 } catch { $refused = $true; Write-Host $_ }
          $server | Stop-Process -Force
          if (-not $refused) { throw "a changed download was installed" }
          if (Test-Path (Join-Path $env:LOCALAPPDATA "Programs\Spry\spry.exe")) { throw "something was installed" }
      - name: Install the way the README says
        shell: pwsh
        run: ./install.ps1
      - name: The installed Spry is running and answers
        shell: pwsh
        run: |
          Start-Sleep -Seconds 5
          $spry = Join-Path $env:LOCALAPPDATA "Programs\Spry\spry.exe"
          & $spry version | Out-Host
          & $spry status | Out-Host
          if (-not (Get-Process spry -ErrorAction SilentlyContinue)) { throw "Spry is not running" }
      - name: The installed Spry updates itself from the release page and starts again
        shell: pwsh
        run: |
          $spry = Join-Path $env:LOCALAPPDATA "Programs\Spry\spry.exe"
          if (-not ((& $spry help | Out-String) -match "spry update")) {
            Write-Host "This release is from before 0.6 and cannot update itself."
            exit 0
          }
          function Running { ((& $spry status --json | Out-String) | ConvertFrom-Json).spry_pid }
          $before = Running
          $env:SPRY_UPDATE_AS = "0.0.1"
          & $spry update | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "spry update failed" }
          Remove-Item Env:SPRY_UPDATE_AS
          Start-Sleep -Seconds 10
          $after = Running
          Write-Host "Spry was process $before and is process $after now"
          if (-not $before -or -not $after -or $after -eq $before) { throw "Spry did not start again as the new version" }
          & $spry status | Select-Object -First 2 | Out-Host
      - name: What Spry itself costs after half a minute
        shell: pwsh
        run: |
          Start-Sleep -Seconds 30
          $spry = Join-Path $env:LOCALAPPDATA "Programs\Spry\spry.exe"
          & $spry status | Select-Object -First 2 | Out-Host
          Get-Process spry | Select-Object WorkingSet64, CPU, StartTime | Format-List | Out-Host
      - name: Stopping it leaves nothing held
        shell: pwsh
        run: |
          $spry = Join-Path $env:LOCALAPPDATA "Programs\Spry\spry.exe"
          Get-Process spry | Stop-Process -Force
          & $spry rescue | Out-Host
